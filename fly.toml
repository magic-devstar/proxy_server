# Fly.io configuration for Riptide Rust Proxy
app = "riptide-demo"
primary_region = "iad" # US East (change to your preferred region)

[build]
  dockerfile = "Dockerfile"

[env]
  RUST_LOG = "info"

# Proxy service on port 8080
[[services]]
  internal_port = 8080
  protocol = "tcp"

  [[services.ports]]
    port = 8080
    handlers = []

# VM configuration
[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Metrics (optional)
[metrics]
  port = 9091
  path = "/metrics"

