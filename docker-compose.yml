version: '3.8'

services:
  riptide:
    build: .
    container_name: riptide-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
      # Add more ports if using range: 8081-8089:8081-8089
    volumes:
      - ./config.json:/etc/riptide/config.json:ro
      - ./logs:/var/log/riptide
    environment:
      - RUST_LOG=info
    networks:
      - riptide-network

  # Optional: Mock API server for testing
  mock-api:
    image: python:3.11-slim
    container_name: riptide-mock-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./mock_api_server.py:/app/mock_api_server.py:ro
    working_dir: /app
    command: python mock_api_server.py
    networks:
      - riptide-network

networks:
  riptide-network:
    driver: bridge

